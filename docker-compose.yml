services:
  bwa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bwa

    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env or environment}
      API_BASE: ${API_BASE:?Set API_BASE in .env or environment}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:?Set MODEL in .env or environment}
      MCP_SERVERS: ${MCP_SERVERS:?Set MCP_SERVERS in .env or environment}
      PROXY: ${PROXY:-}
      TG_PROXY: ${TG_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHECK_HISTORY: ${CHECK_HISTORY:-false}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

    volumes:
      - "./data:/app/data"
      - ./config:/app/config

    networks:
      - agent_net

  searxng:
    image: searxng/searxng:latest
    container_name: bwa-searxng
    restart: unless-stopped

    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

    volumes:
      - "./searxng:/etc/searxng"

    networks:
      - agent_net

  mcp-search:
    image: isokoliuk/mcp-searxng:latest
    container_name: bwa-mcp-search
    restart: unless-stopped

    depends_on:
      - searxng

    environment:
      SEARXNG_URL: http://searxng:8080
      SEARXNG_DEFAULT_LANGUAGE: en
      SEARXNG_TIMEOUT_MS: "15000"
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"

    networks:
      - agent_net

networks:
  agent_net:
    driver: bridge

volumes:
  searxng_cache:
